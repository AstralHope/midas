server {
    listen       9019; 
    server_name  midas;

    # 【关键修改】根目录统一指向容器内代码挂载点
    root   /usr/nginx/deskecc/mid; 
    index  index.php index.html index.htm;

    location / {
        root   /usr/nginx/deskecc/mid;
        index  index.php index.html index.htm;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        # 假设 50x.html 放在 Nginx 编译时默认的 html 目录
        root   /usr/nginx/html; 
    }

    location ~ /services/ {
        # 确保路径指向代码目录
        root   /usr/nginx/deskecc/mid; 
        index  index.php index.html index.htm;
    }

    # Jifa 堆内存/诊断分析服务反向代理（无需暴露额外端口）
    location = /jifa {
        return 301 /jifa/;
    }

    location ^~ /jifa/ {
        proxy_pass http://jifa:8102/;
        proxy_set_header Host $host:$server_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 支持
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # 支持分析大文件（Heap Dump 最高 15GB）上传与长时间分析
        client_max_body_size 15360m;
        client_body_timeout 3600s;
        proxy_connect_timeout 300s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # 禁用上游压缩，确保 Nginx 动态内容替换（sub_filter）生效
        proxy_set_header Accept-Encoding "";

        # 关键优化：将 Vue Router 动态替换为 Hash 模式并重写 Base 路径
        # 彻底解决单页面应用在 /jifa/ 子路径下的 404 路由丢失问题，无需暴露任何额外端口
        sub_filter_types text/html application/javascript text/javascript;
        sub_filter_once off;
        sub_filter 'mode:"history"' 'mode:"hash"';
        sub_filter 'mode: "history"' 'mode: "hash"';
        sub_filter 'base:"/"' 'base:"/jifa/"';
        sub_filter 'base: "/"' 'base: "/jifa/"';
    }

    # Jifa 后端 API 与数据接口反向代理
    location ^~ /jifa-api/ {
        proxy_pass http://jifa:8102/jifa-api/;
        proxy_set_header Host $host:$server_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 支持
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # 大文件 Dump 上传（最高 15GB）与长时间分析
        client_max_body_size 15360m;
        client_body_timeout 3600s;
        proxy_connect_timeout 300s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Jifa WebSocket 实时通信接口
    location ^~ /jifa-ws/ {
        proxy_pass http://jifa:8102/jifa-ws/;
        proxy_set_header Host $host:$server_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # pass the PHP scripts to FastCGI server
    location ~ \.php$ {
        # 确保路径指向 PHP 文件所在的目录
        root   /usr/nginx/deskecc/mid; 
        
        # 转发给 PHP-FPM 服务名
        fastcgi_pass   app:9000; 
        
        fastcgi_index  index.php;
        
        fastcgi_param  SCRIPT_FILENAME    $document_root$fastcgi_script_name;
        fastcgi_param  SCRIPT_NAME        $fastcgi_script_name;
        fastcgi_param  HTTP_AUTHORIZATION $http_authorization;
        include        fastcgi_params;
    }
}
